name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of re-locking when uv.lock is out of date with pyproject.toml.
  UV_LOCKED: "1"

# Each job installs uv at the lowest version pyproject.toml's required-version allows, the
# version the project promises to work with, and runs the same make target as a developer.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          resolution-strategy: lowest
          python-version: "3.14"
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          resolution-strategy: lowest
          python-version: "3.14"
      - run: make typecheck

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          resolution-strategy: lowest
          python-version: "3.14"
      - run: make test
      - name: Add the coverage report to the job summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # The one required status check. It fails unless every job above succeeded, including a
  # job that was skipped or cancelled, and its name stays the same when the jobs change.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
