# Weekly updates, grouped so that each ecosystem opens at most one pull request a week for
# non-major updates. Major updates come one at a time, since they can need code changes.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The Dockerfile's base images, pinned by digest: a new digest, or a newer patch or minor
  # version of the same image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
